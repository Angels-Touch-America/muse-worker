name: Build and push worker image

on:
  push:
    branches: [fix/worker-deps]
  workflow_dispatch:

env:
  IMAGE: dmacx2x/ata-render-worker:v25

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: Smoke test - worker dependencies import
        run: docker run --rm --entrypoint python "$IMAGE" -c "import runpod, cloudinary, requests; print('ok')"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}